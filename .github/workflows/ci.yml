name: Docs-as-Code Quality Check

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute THR-03 Acceptance Test
        run: |
          chmod +x src/cgos_access_check.sh
          ./src/cgos_access_check.sh
